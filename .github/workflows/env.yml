
name: Environment Variables
on:
  workflow_dispatch: 

env:
  APP_NAME: myapp

jobs:

  env-demo:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging
    
    steps:
      - name: Version
        env:
          VERSION: 1.0.0
        run: |
           echo "App Name: $APP_NAME"
           echo "Environment: $ENVIRONMENT"
           echo "Version: $VERSION"
           echo "${{ github.sha }}"
           echo "${{github.actor}}"
        
