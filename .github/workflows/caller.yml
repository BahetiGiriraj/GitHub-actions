name: Caller

on:
  workflow_dispatch:


jobs:
  build:
    uses: ./github/workflows/reusable-build.yml
    with:
      app_name: myapp

      environment: production

    secrets:

      docker_token: ${{ secrets.DOCKERHUB_TOKEN }}

   print-version:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print Build Version
        run: |
          echo "Build Version: ${{ needs.build.outputs.build_version }}"
