name: Reusable Build

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

      environment:
        required: false
        default: staging
        type: string

    secrets:
      docker_token:
        required: true

    outputs:
      build_version:
        description: Build version generated by workflow
        value: ${{ jobs.build.outputs.build_version }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.version.outputs.BUILD_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Version
        id: version
        run: |
          VERSION="v1.0-${GITHUB_SHA::7}"
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Information
        run: |
          echo "Building ${{ inputs.app_name }} for ${{ inputs.environment }}"
          echo "Generated Version: ${{ steps.version.outputs.BUILD_VERSION }}"

      - name: Verify Docker Token
        run: |
          echo "Docker token is set: ${{ secrets.docker_token != '' }}"
