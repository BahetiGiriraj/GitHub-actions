name: Use Composite Action

on:
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run custom action
        id: greet
        uses: ./.github/actions/setup-and-greet
        with:
          name: Giriraj
          language: en

      - name: Verify output
        run: echo "Greeted = ${{ steps.greet.outputs.greeted }}"
